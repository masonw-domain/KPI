<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Points</title>
<meta name="description" content="Tap in today's counts to get your KPI points, today's goal and a Mon–Fri tally.">
<meta name="theme-color" content="#060807">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPI Points">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single quiet column — big total, five tap rows, one log button, a slim week strip. Dark-only by choice. */
:root{
  --bg:#060807;
  --row:#0d110f;
  --line:#18201c;
  --muted:#6f7d76;
  --fg:#eaf1ed;
  --green:#3ddc84;
  --amber:#e8b34a;
  --display:"Sora", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--display);font-size:15px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.total{font-size:clamp(64px,20vw,88px);font-weight:500;line-height:1;letter-spacing:-.04em;transition:color .3s,transform .15s}
.total.hit{color:var(--green)}
.total.pop{transform:scale(1.04)}
.sub{font-size:13px;color:var(--muted)}
.sub b{color:var(--fg);font-weight:500}
.bar{width:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s ease}

/* Category rows */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;border-radius:14px;padding:8px 8px 8px 16px;background:color-mix(in srgb,var(--row) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.item .name{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .name small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.item.off{opacity:.45}
.ctrl{display:flex;align-items:center;gap:2px}
.ctrl button{width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:20px;cursor:pointer;font-family:var(--mono);transition:background .15s,color .15s,transform .08s}
.ctrl button:hover{color:var(--green);background:var(--line)}
.ctrl button:active{transform:scale(.92)}
.ctrl input{width:44px;height:44px;border:0;background:none;color:var(--fg);text-align:center;font-family:var(--mono);font-size:17px;-moz-appearance:textfield;transition:transform .12s,color .2s}
.ctrl input.wide{width:58px}
.ctrl input.bump{transform:scale(1.18);color:var(--green)}
.ctrl input::-webkit-outer-spin-button,.ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Actions */
.log{width:100%;padding:15px;border:0;border-radius:14px;background:var(--green);color:#03130a;font-family:var(--display);font-size:15px;font-weight:500;cursor:pointer;transition:transform .08s,filter .15s}
.log:hover{filter:brightness(1.08)}
.log:active{transform:scale(.985)}
.links{display:flex;justify-content:center;gap:20px;margin-top:12px}
.link{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:12px;cursor:pointer;padding:6px}
.link:hover{color:var(--fg)}
.link.armed{color:var(--amber)}

/* Week */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{--p:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;background:color-mix(in srgb,var(--row) 82%,transparent);border:1px solid transparent;cursor:pointer;color:var(--fg);font:inherit}
.day::before{content:"";position:absolute;inset:auto 0 0;height:calc(var(--p) * 100%);background:linear-gradient(to top,color-mix(in srgb,var(--green) 22%,transparent),color-mix(in srgb,var(--green) 4%,transparent));transition:height .4s ease}
.day>*{position:relative}
.day.sel{border-color:var(--green)}
.day span:first-child{font-size:11px;color:var(--muted)}
.day.sel span:first-child{color:var(--green)}
.day .v{font-size:14px}
.day .v.hit{color:var(--green)}
.weekline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px}
.weekline b{color:var(--fg);font-weight:500}

button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* Ambient background + particles */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.16;transition:opacity .5s}
.bg i:nth-child(1){background:radial-gradient(circle,#2fd47a 0%,transparent 65%);top:-30vmax;left:-20vmax;animation:drift1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(circle,#0f7f6a 0%,transparent 65%);bottom:-35vmax;right:-25vmax;animation:drift2 34s ease-in-out infinite alternate;opacity:.2}
.bg i:nth-child(3){background:radial-gradient(circle,#7be3a8 0%,transparent 60%);top:30%;left:40%;width:40vmax;height:40vmax;opacity:.06;animation:drift3 40s ease-in-out infinite alternate}
.bg.glow i:nth-child(1){opacity:.3}
@keyframes drift1{to{transform:translate(18vmax,12vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vmax,-10vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-20vmax,8vmax)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:4;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--row) 80%,transparent);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.mute:hover{color:var(--green)}
.mute svg{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Booking calc: pill opener + bottom sheet */
.opener{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--row) 82%,transparent);color:var(--muted);font-family:var(--display);font-size:13px;cursor:pointer;transition:color .15s,border-color .15s}
.opener:hover{color:var(--fg);border-color:var(--muted)}
.opener svg{width:16px;height:16px}
.scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:440px;margin:0 auto;background:var(--row);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;max-height:92vh;overflow-y:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.scrim.open{opacity:1;pointer-events:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:15px;font-weight:500}
.x{width:36px;height:36px;border:0;border-radius:50%;background:var(--line);color:var(--muted);font-size:18px;cursor:pointer}
.x:hover{color:var(--fg)}
.size{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .2s}
.size:focus-within{border-color:var(--green)}
.size input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.03em;padding:0;-moz-appearance:textfield}
.size input:focus{outline:none}
.size input::placeholder{color:#2a332e}
.size input::-webkit-outer-spin-button,.size input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.size span{color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--fg);font-family:var(--display);font-size:14px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.chip small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 9%,transparent)}
.chip[aria-pressed="true"] small{color:var(--green)}
.out{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.out div{display:flex;flex-direction:column;gap:6px;align-items:center}
.out b{font-family:var(--mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.out small{font-size:11px;color:var(--muted)}
.slots{display:flex;gap:4px;height:24px;align-items:center}
.slots i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);transition:background .2s,border-color .2s}
.slots i.on{background:var(--green);border-color:var(--green)}
.brk{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;min-height:1.4em}
.log:disabled{background:var(--line);color:var(--muted);cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.bg i{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="mute" id="mute" type="button" aria-label="Mute sounds"></button>
<div class="wrap">
  <section class="hero">
    <div class="sub" id="date"></div>
    <div class="total num" id="total" aria-hidden="true">0.00</div>
    <div class="sub" id="goalLine">Goal <b class="num">1.00</b></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="sr" id="live" aria-live="polite"></div>
  </section>

  <div class="list" id="list"></div>

  <div>
    <button class="log" id="log" type="button">Log to Mon</button>
    <div class="links">
      <button class="link" id="clear" type="button">Clear counts</button>
      <button class="link" id="reset" type="button">Reset week</button>
    </div>
  </div>

  <section aria-label="This week">
    <div class="week" id="week"></div>
    <div class="weekline"><span>Week <b class="num" id="wSum">0.00</b> / 5</span><span id="wNeed">Need 1.00 / day</span></div>
  </section>

  <button class="opener" id="openCalc" type="button" aria-haspopup="dialog" aria-controls="sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
    Booking calc
  </button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Booking calc</h2><button class="x" id="closeCalc" type="button" aria-label="Close booking calc">×</button></div>
  <label class="size" for="area"><input id="area" type="number" inputmode="decimal" min="0" step="any" placeholder="0" autocomplete="off" aria-label="Property size in square metres"><span>m²</span></label>
  <div class="chips">
    <button class="chip" type="button" data-svc="mp" aria-pressed="false">MP<small id="mpMin">by size</small></button>
    <button class="chip" type="button" data-svc="photo" aria-pressed="false">Photo<small>45 min</small></button>
    <button class="chip" type="button" data-svc="splat" aria-pressed="false">Splat<small>15 min</small></button>
  </div>
  <div class="out" aria-live="polite">
    <div><b id="bMin">–</b><small>minutes</small></div>
    <div><span class="slots" id="bSlots" aria-label="0 slots"><i></i><i></i><i></i></span><small>slots</small></div>
    <div><b id="bPts">–</b><small>points</small></div>
  </div>
  <div class="brk" id="bBrk">Tick a service to start</div>
  <button class="log" id="addBooking" type="button" disabled>Add to today</button>
</div>

<script>
/* ---------- Data ---------- */
// Point values from Point_Calc.xlsx row 2 (A2:E2)
const CATS=[
  {k:"photos",n:"Photos",w:0.0556},
  {k:"leads",n:"Leads",w:0.0667},
  {k:"newinv",n:"New Inv",w:0},
  {k:"nonprod",n:"Non Prod",w:0.1315,step:.25,unit:"hr"},  // 1 = one hour, steps in 15 min
  {k:"resi",n:"Resi",w:0.333},
];
const DAYS=["Mon","Tue","Wed","Thu","Fri"];
const WEEK_TARGET=5, KEY="kpi-points-v2";
const f2=n=>(Math.round(n*100)/100).toFixed(2);
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const stamp=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const mondayOf=d=>{const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return stamp(m)};
const emptyCounts=()=>Object.fromEntries(CATS.map(c=>[c.k,0]));

let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const S={
  c:Object.assign(emptyCounts(),saved.c||{}),
  week:Array.isArray(saved.week)&&saved.week.length===5?saved.week:[null,null,null,null,null],
  day:saved.day, weekOf:saved.weekOf, sel:0
};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({c:S.c,week:S.week,day:S.day,weekOf:S.weekOf}))}catch(e){}};

// New day → fresh counts. New week → fresh Mon–Fri. Runs on load and when the app comes back to the front.
function rollover(){
  const now=new Date(),today=stamp(now),wk=mondayOf(now);
  let changed=false;
  if(S.day!==today){S.c=emptyCounts();S.day=today;changed=true}
  if(S.weekOf!==wk){S.week=[null,null,null,null,null];S.weekOf=wk;changed=true}
  const wd=now.getDay();S.sel=wd>=1&&wd<=5?wd-1:S.sel;
  $("date").textContent=now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  return changed;
}
const total=()=>CATS.reduce((s,c)=>s+(+S.c[c.k]||0)*c.w,0);

/* ---------- Sound ---------- */
let muted=false;try{muted=localStorage.getItem(KEY+"-mute")==="1"}catch(e){}
let ac,master;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;master.connect(lp);lp.connect(ac.destination)}catch(e){return null}}
  if(ac.state==="suspended")ac.resume();return ac;
}
function tone(freq,{t=0,dur=.18,vol=.18,type="sine",glide=0}={}){
  if(muted)return;const a=audio();if(!a)return;
  const s=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,s);if(glide)o.frequency.exponentialRampToValueAtTime(freq*glide,s+dur);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.008);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
  o.connect(g);g.connect(master);o.start(s);o.stop(s+dur+.02);
}
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5];
const sfx={
  up:i=>{const f=SCALE[i%SCALE.length]*(i>=SCALE.length?2:1);tone(f,{dur:.16,vol:.13});tone(f*2,{dur:.09,vol:.03,type:"triangle"})},
  down:()=>tone(392,{dur:.14,vol:.1,glide:.8}),
  log:()=>[659.25,783.99,1046.5].forEach((f,i)=>tone(f,{t:i*.07,dur:.35,vol:.12,type:"triangle"})),
  goal:()=>{[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,{t:i*.06,dur:.6,vol:.1}));tone(2093,{t:.32,dur:.8,vol:.03,type:"triangle"})},
  clear:()=>tone(330,{dur:.3,vol:.08,glide:.5,type:"triangle"}),
  tap:()=>tone(1200,{dur:.05,vol:.05,type:"triangle"})
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const muteBtn=$("mute");
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function drawMute(){muteBtn.innerHTML=muted?ICON_OFF:ICON_ON;muteBtn.setAttribute("aria-label",muted?"Unmute sounds":"Mute sounds")}
muteBtn.onclick=()=>{muted=!muted;try{localStorage.setItem(KEY+"-mute",muted?"1":"0")}catch(e){}drawMute();if(!muted)sfx.tap()};
drawMute();

/* ---------- Particles (time-based so 60Hz and 120Hz screens match) ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let P=[],running=false,last=0;
function size(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
const COLS=["61,220,132","123,227,168","200,255,220","47,180,140"];
function burst(x,y,n=10,power=2.2,spread=Math.PI*2,dir=-Math.PI/2,life=50){
  if(reduce)return;
  for(let i=0;i<n;i++){const a=dir+(Math.random()-.5)*spread,v=power*(.4+Math.random());
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:.8+Math.random()*1.8,l:0,L:life*(.6+Math.random()*.6),c:COLS[i%COLS.length]})}
  if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}
}
function tick(now){
  const k60=Math.min(3,(now-last)/16.67);last=now;
  cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l<p.L);
  for(const p of P){
    p.l+=k60;p.x+=p.vx*k60;p.y+=p.vy*k60;
    const drag=Math.pow(.96,k60);p.vx*=drag;p.vy=p.vy*drag+.035*k60;
    const a=Math.max(0,1-p.l/p.L);
    cx.beginPath();cx.fillStyle=`rgba(${p.c},${a*.9})`;cx.shadowColor=`rgba(${p.c},${a*.6})`;cx.shadowBlur=8;
    cx.arc(p.x,p.y,p.r*(.6+a*.4),0,Math.PI*2);cx.fill();
  }
  if(P.length)requestAnimationFrame(tick);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}
const center=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function celebrate(){
  const [x,y]=center($("total"));
  burst(x,y,46,4.2,Math.PI*2,0,90);
  const bg=$("bg");bg.classList.add("glow");setTimeout(()=>bg.classList.remove("glow"),1400);
  sfx.goal();buzz([12,40,18]);
}
function flash(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}

/* ---------- Rolling total ---------- */
let shown=0,target=0,rafT=0;
function rollTo(v){
  target=v;if(reduce){shown=v;$("total").textContent=f2(v);return}
  if(rafT)return;
  const step=()=>{shown+=(target-shown)*.28;if(Math.abs(target-shown)<.003)shown=target;
    $("total").textContent=f2(shown);rafT=shown===target?0:requestAnimationFrame(step)};
  rafT=requestAnimationFrame(step);
}

/* ---------- UI ---------- */
const list=$("list");
CATS.forEach(c=>{
  const el=document.createElement("div");
  el.className="item"+(c.w?"":" off");
  el.innerHTML=`<div class="name"><span>${c.n}</span><small>${!c.w?"not counted":c.unit?c.w+" / hr · 15 min":c.w+" each"}</small></div>
  <div class="ctrl"><button type="button" data-d="-1" aria-label="${c.step?"Remove 15 minutes of":"Remove one"} ${c.n}">−</button>
  <input id="c-${c.k}" class="num${c.step?" wide":""}" type="number" min="0" step="${c.step||1}" inputmode="${c.step?"decimal":"numeric"}" aria-label="${c.n} ${c.unit?"hours":"count"}">
  <button type="button" data-d="1" aria-label="${c.step?"Add 15 minutes of":"Add one"} ${c.n}">+</button></div>`;
  const inp=el.querySelector("input");
  c.input=inp;

  const step=(d,btn)=>{
    const inc=c.step||1,before=+S.c[c.k]||0,after=Math.max(0,Math.round((before+d*inc)/inc)*inc);
    if(after===before)return false;
    S.c[c.k]=after;inp.value=after;flash(inp,"bump",120);
    if(d>0){sfx.up(Math.round(after/inc)-1);buzz(6);const [x,y]=center(btn);burst(x,y,c.w?9:4,2);if(c.w)flash($("total"),"pop",140)}
    else{sfx.down();buzz(4)}
    render({fromUser:d>0});return true;
  };
  // Press and hold to repeat, speeding up; a plain click (keyboard) steps once.
  el.querySelectorAll("button").forEach(b=>{
    const d=+b.dataset.d;let timer=0,delay=0,held=false;
    const stop=()=>{clearTimeout(timer);timer=0};
    b.addEventListener("pointerdown",e=>{
      if(e.button!==0)return;held=true;step(d,b);delay=380;
      const loop=()=>{if(!step(d,b))return stop();delay=Math.max(55,delay*.82);timer=setTimeout(loop,delay)};
      timer=setTimeout(loop,delay);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,stop));
    b.addEventListener("click",()=>{if(held){held=false;return}step(d,b)});
  });
  inp.addEventListener("input",()=>{const inc=c.step||1;S.c[c.k]=Math.max(0,Math.round((parseFloat(inp.value)||0)/inc)*inc);render({fromUser:true})});
  inp.addEventListener("blur",()=>{inp.value=S.c[c.k]});
  inp.addEventListener("focus",()=>inp.select());
  list.appendChild(el);
});

const week=$("week");
DAYS.forEach((d,i)=>{
  const b=document.createElement("button");
  b.className="day";b.type="button";
  b.innerHTML=`<span>${d}</span><span class="v num">—</span>`;
  b.onclick=()=>{if(S.sel!==i){sfx.tap();buzz(4)}S.sel=i;render()};
  week.appendChild(b);
});

let wasHit=null;
function render({fromUser=false}={}){
  const t=total();
  // Today's goal, per the sheet: (days logged + 1) − week total. The selected day's own entry is left out.
  const others=S.week.filter((v,i)=>i!==S.sel&&v!=null);
  const goal=Math.max(0,others.length+1-others.reduce((a,b)=>a+b,0));
  const hit=t>0&&t>=goal-0.005;
  rollTo(t);
  $("total").classList.toggle("hit",hit);
  if(fromUser&&wasHit===false&&hit)setTimeout(celebrate,60);
  wasHit=hit;

  const left=goal-t;
  $("goalLine").innerHTML=`Goal <b class="num">${f2(goal)}</b> · ${left>0.005?`<span class="num">${f2(left)}</span> to go`:"done"}`;
  $("bar").style.width=(goal?Math.min(100,t/goal*100):100)+"%";
  $("live").textContent=`${f2(t)} points. ${left>0.005?f2(left)+" to go.":"Goal done."}`;
  $("log").textContent=`${S.week[S.sel]!=null?"Update":"Log"} ${f2(t)} to ${DAYS[S.sel]}`;

  [...week.children].forEach((b,i)=>{
    const v=S.week[i],ve=b.querySelector(".v");
    b.classList.toggle("sel",i===S.sel);
    b.style.setProperty("--p",v==null?0:Math.min(1,Math.max(0,v)));
    ve.textContent=v==null?"—":f2(v);ve.classList.toggle("hit",v!=null&&v>=0.995);
    b.setAttribute("aria-label",`${DAYS[i]}: ${v==null?"not logged":f2(v)+" points"}`);
    b.setAttribute("aria-pressed",i===S.sel);
  });
  const logged=S.week.filter(v=>v!=null),sum=logged.reduce((a,b)=>a+b,0),rem=5-logged.length;
  $("wSum").textContent=f2(sum);
  $("wNeed").textContent=sum>=WEEK_TARGET-0.005?"Week target hit":rem?`Need ${f2((WEEK_TARGET-sum)/rem)} / day`:`${f2(WEEK_TARGET-sum)} short`;
  save();
}

// Two-tap confirm for anything that wipes data
function armed(btn,label,confirmLabel,action){
  let on=false,t=0;
  btn.onclick=()=>{
    if(!on){on=true;btn.textContent=confirmLabel;btn.classList.add("armed");sfx.tap();
      t=setTimeout(()=>{on=false;btn.textContent=label;btn.classList.remove("armed")},3000);return}
    clearTimeout(t);on=false;btn.textContent=label;btn.classList.remove("armed");action();
  };
}

$("log").onclick=()=>{
  S.week[S.sel]=Math.round(total()*100)/100;render();sfx.log();buzz(10);
  const [x,y]=center(week.children[S.sel]);burst(x,y,22,2.8,Math.PI*1.2,-Math.PI/2,70);
};
armed($("clear"),"Clear counts","Tap again to clear",()=>{
  if(total()>0)sfx.clear();S.c=emptyCounts();CATS.forEach(c=>c.input.value=0);render();
});
armed($("reset"),"Reset week","Tap again to reset",()=>{
  sfx.clear();S.week=[null,null,null,null,null];render();
});

/* ---------- Booking calc (same rules as the team's BookingCalc app) ---------- */
// MP: 30 min, plus 15 min for every 45 m² (or part) over 180 m². Photo 45, Splat 15.
// Slots: up to 90 min = 1, up to 210 = 2, more = 3. Each slot = 0.333 pts = one Resi.
const mpMinutes=a=>{const extra=a-135-45;return 30+(extra>0?Math.ceil(extra/45):0)*15};
const slotsFor=m=>m>210?3:m>90?2:1;
const B={mp:false,photo:false,splat:false};
let booking=null,lastFocus=null;

function calcBooking(){
  const raw=$("area").value.trim(),area=parseFloat(raw)||0;
  $("mpMin").textContent=area>0?mpMinutes(area)+" min":"by size";
  const any=B.mp||B.photo||B.splat;
  const need=B.mp&&!(area>0);
  booking=null;
  if(any&&!need){
    const m=B.mp?mpMinutes(area):0,p=B.photo?45:0,s=B.splat?15:0,total=m+p+s,slots=slotsFor(total);
    booking={total,slots,points:slots*0.333};
    $("bBrk").textContent=[B.mp&&"MP "+m,B.photo&&"Photo "+p,B.splat&&"Splat "+s].filter(Boolean).join(" + ")+" = "+total+" min";
  }else{
    $("bBrk").textContent=need?"Enter the size for MP":"Tick a service to start";
  }
  $("bMin").textContent=booking?booking.total:"–";
  $("bPts").textContent=booking?booking.points.toFixed(3):"–";
  [...$("bSlots").children].forEach((i,n)=>i.classList.toggle("on",!!booking&&n<booking.slots));
  $("bSlots").setAttribute("aria-label",(booking?booking.slots:0)+" slots");
  const add=$("addBooking");add.disabled=!booking;
  add.textContent=booking?`Add ${booking.slots} Resi to today`:"Add to today";
}
function resetBooking(){$("area").value="";Object.keys(B).forEach(k=>B[k]=false);
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));calcBooking()}

function openSheet(){lastFocus=document.activeElement;$("sheet").classList.add("open");$("scrim").classList.add("open");sfx.tap();
  setTimeout(()=>$("area").focus({preventScroll:true}),320)}
function closeSheet(){$("sheet").classList.remove("open");$("scrim").classList.remove("open");lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})}

$("openCalc").onclick=openSheet;
$("closeCalc").onclick=closeSheet;
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("open"))closeSheet()});
$("area").addEventListener("input",calcBooking);
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  const k=c.dataset.svc;B[k]=!B[k];c.setAttribute("aria-pressed",B[k]);
  B[k]?sfx.up(2):sfx.down();buzz(5);calcBooking();
});
$("addBooking").onclick=()=>{
  if(!booking)return;
  const n=booking.slots,resi=CATS.find(c=>c.k==="resi");
  closeSheet();resetBooking();
  S.c.resi=(+S.c.resi||0)+n;resi.input.value=S.c.resi;
  setTimeout(()=>{
    const row=resi.input.closest(".item");row.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
    flash(resi.input,"bump",160);flash($("total"),"pop",140);
    const [x,y]=center(resi.input);burst(x,y,14+n*6,2.6);
    sfx.log();buzz(10);render({fromUser:true});
  },260);
};
calcBooking();

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&rollover()){CATS.forEach(c=>c.input.value=S.c[c.k]);wasHit=null;render()}
});

rollover();
CATS.forEach(c=>c.input.value=S.c[c.k]);
shown=total();
render();

// Offline support + installable app
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
